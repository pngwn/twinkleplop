name: Deploy site

on:
  # the site's benchmark page is built from the benchmark artifact, so the
  # deploy has to happen after a benchmark run rather than alongside it. this
  # is the dependency, expressed directly: main is benchmarked, then the site
  # is built from what that run measured.
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]
    branches: [main]
  # redeploy without re-benchmarking. picks up the most recent successful
  # benchmark artifact, so a copy fix does not cost half an hour of CI.
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  deploy:
    name: Build and deploy
    # a benchmark run that was cancelled has no artifact to deploy. a run that
    # FAILED does: the failure is a performance verdict, and a regression is
    # not a reason to stop shipping documentation. the numbers it measured are
    # still the numbers, and the page will show them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: namespace-profile-basic
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          # deploy what main says now, not what it said when the benchmark
          # started. the artifact supplies the numbers; the repo supplies the
          # site. the page prints the commit the numbers came from, so the two
          # drifting apart is visible rather than silent.
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: pnpm

      - name: Download benchmark results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ github.event.workflow_run.id }}"
          if [ -z "$run_id" ]; then
            # manual deploy: fall back to the newest benchmark run on main
            # that actually produced an artifact.
            run_id=$(gh run list --workflow Benchmarks --branch main \
              --limit 20 --json databaseId,conclusion \
              --jq 'map(select(.conclusion != "cancelled")) | .[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "no benchmark run found; the site will build with an empty benchmarks page"
            exit 0
          fi
          echo "using benchmark run $run_id"
          mkdir -p lib/bench/results
          # a benchmark run without the comparison job (a pull request that
          # was not labelled, say) has no comparison.json. the page renders an
          # honest empty state for that, so a missing artifact must not fail
          # the deploy.
          gh run download "$run_id" --name benchmarks --dir /tmp/bench-artifact || {
            echo "artifact missing; the site will build with an empty benchmarks page"
            exit 0
          }
          # upload-artifact strips the common ancestor of everything it was
          # given, so the layout inside the archive depends on which files
          # that run happened to produce. searching for the file is the only
          # form of this that does not break the next time a path is added to
          # the upload step.
          found=$(find /tmp/bench-artifact -name comparison.json -print -quit)
          if [ -n "$found" ]; then
            cp "$found" lib/bench/results/comparison.json
            echo "benchmarks page will render results from run $run_id"
          else
            echo "artifact has no comparison.json; benchmarks page will be empty"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Build site
        run: pnpm --filter=site build

      - name: Deploy to Cloudflare
        working-directory: lib/_site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
