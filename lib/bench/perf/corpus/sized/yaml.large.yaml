# ---- unit 1 ----
%YAML 1.2
---
# site deployment configuration
name: "twinkleplop\nhighlighter"
version: 1.0.0
published: true
owners: null
banner: |
  line one
  line two
rollout: &base
  retries: 3
  timeout: 30s
environments:
  - name: "staging"
    url: "https://staging.example.com"
    <<: *base
  - name: "prod"
    url: "https://example.com"
    retries: 5
tags: [demo, showcase]


# ---- unit 2 ----
# ---- anchors.yaml ----
server: &default
  host: localhost
  port: 8080
backup: *default
tagged: !!str "hello"
custom_tag: !myapp/widget 42
verbatim_tag: !<tag:example.com,2024:foo> value
named_handle: !e!special data


# ---- basic.yaml ----
name: widget
version: 1.2.3
active: true
count: 42


# ---- block.yaml ----
sequence:
  - apple
  - banana
  - cherry
mapping:
  key1: value1
  key2: value2
mixed:
  - name: first
    value: 1
  - name: second
    value: 2


# ---- block_scalars.yaml ----
literal: |
  line one
  line two
folded: >
  words wrap
  into one line
stripped: |-
  no trailing newline
kept: |+
  keep trailing
explicit: |2
  indented
next: value


# ---- bools_null.yaml ----
strict_true: true
strict_false: False
legacy_yes: yes
legacy_no: NO
legacy_on: on
legacy_off: Off
short_y: y
short_n: N
null_word: null
null_upper: NULL
null_tilde: ~
not_bool: tRuE
not_null: null-ish


# ---- comments.yaml ----
# top level comment
key: value  # trailing comment
# another comment
other: 42
no_space: foo#bar


# ---- directives.yaml ----
%YAML 1.2
%TAG !e! tag:example.com,2024:
---
document: first
...
---
document: second
...


# ---- flow.yaml ----
seq: [1, 2, 3]
map: { host: localhost, port: 8080 }
nested: [[1, 2], { a: 1, b: 2 }]
mixed: [true, null, "string", 1.5]
tagged: [!!str 3, !custom value]
trailing_comma: [1, 2, 3,]


# ---- numbers.yaml ----
decimal: 42
negative: -17
positive: +3
float: 3.14
exponent: 1.5e-3
leading_dot: .5
trailing_dot: 5.
hex: 0xFF
octal: 0o755
infinity: .inf
neg_inf: -.Inf
nan: .NaN
not_number: 0b1010
timestamp: 2024-01-02


# ---- scalars.yaml ----
plain: hello world
double: "escaped \"quote\" and \n newline"
single: 'it''s fine'
empty_dq: ""
empty_sq: ''
url: https://example.com/path
path: /usr/local/bin
regex: '\d+\.\d+'
embedded_colon: foo:bar
hash_interior: foo#bar


# ---- unit 3 ----
# ---- .github/workflows/ci-tests.yml ----
name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build required test artifacts
        run: pnpm --filter=@twinkleplop/theme-github build

      - name: Run tests
        run: pnpm test

  build:
    name: Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build


# ---- .github/workflows/release.yml ----
name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



