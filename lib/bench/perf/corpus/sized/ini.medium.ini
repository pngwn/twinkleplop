; ---- unit 1 ----
; sample settings file
[server]
host = 0.0.0.0
port = 8080 ; inline comment
banner = "hello \"world\""
motd = 'it is quiet here'
command = /usr/bin/app --verbose \
    --log-level=debug

[remote "origin"]
	url = git@example.com:team/project.git
	fetch = +refs/heads/*:refs/remotes/origin/*

[*.{js,ts}]
indent_size = 2

[metadata]
classifiers =
    Programming Language :: Python :: 3
    # comments stay inside the value
    License :: OSI Approved :: MIT License
Name[de]=Beispiel
docs = https://example.com/setup#install


; ---- unit 2 ----
; ---- comments.ini ----
; semicolon comment
# hash comment
  ; indented comment
	# tab-indented comment
#!/usr/bin/env tool
;extension=disabled_entry
;[disabled.section]
; quotes are inert in comments: it's "open
[section]
key = value ; trailing comment
key = value # trailing hash comment
key = value;comment without a space
key = value#not a comment
Keywords=shell;prompt;command;
escaped = shell\;prompt\;command
tox = a \#not a comment
url = http://example.com/?a=b#fragment
color = #fff
sem=;
bare;comment after a bare key
bare ; comment after a bare key
quoted = "a ; b # c" ; comment after a string


; ---- continuations.ini ----
[metadata]
description =
    first continuation line
    factor: looks like a key but continues
    NAME=continues too

    # a comment inside the value
    after the blank line and the comment
    [not.a.section]
next = column zero starts a new key

[options]
  indented = key at indent 2
    deeper = continues the indented key
  sibling = same indent, new key
	tabbed = tab is one column, new key

[alias]
	lg = log --graph \
		--oneline
	st = status

[Service]
ExecStart=/usr/bin/daemon \
    --flag \
    --other
Dir=C:\Games\
Next=column zero after a trailing backslash
even = two backslashes \\
not = a continuation


; ---- dialect_desktop.ini ----
[Desktop Entry]
Type=Application
Name=Example Terminal
Name[de]=Beispiel-Terminal
Name[sr@Latn]=Primer
Comment=Use the command line
Keywords=shell;prompt;command;commandline;cmd;
Exec=example-terminal %U
Icon=org.example.Terminal
Categories=GNOME;GTK;System;TerminalEmulator;
StartupNotify=true
Actions=new-window;preferences;

[Desktop Action new-window]
Name=New Window
Exec=example-terminal --window


; ---- dialect_editorconfig.ini ----
# top-most EditorConfig file
root = true

[*]
charset = utf-8
end_of_line = lf
insert_final_newline = true

[*.[ch]]
indent_style = tab
tab_width = 8

[{*.{c,h,sh,bash,perl,pl,pm,txt,adoc},config.mak.*,Makefile}]
indent_style = tab

[lib/**.js]
indent_style = space
indent_size = 2

[{package.json,.travis.yml}]
indent_size = 2


; ---- dialect_git.ini ----
# global git configuration
[user]
	name = Example Person
	email = person@example.com
[alias]
	# short status
	s = status -s
	l = log --pretty=oneline -n 20 --graph --abbrev-commit
	d = !"git diff-index --quiet HEAD -- || clear; git --no-pager diff"
	ca = !git add ':(exclude,attr:builtin_objectmode=160000)' && git commit -av
	go = "!f() { git checkout -b \"$1\" 2> /dev/null || git checkout \"$1\"; }; f"
[color "diff"]
	meta = yellow bold
	frag = magenta bold # line info
	old = red ; deletions
[url "git@github.com:"]
	insteadOf = "gh:"
[includeIf "gitdir:~/work/"]
	path = ~/.gitconfig-work
[core]
	excludesfile = ~/.gitignore
	whitespace = space-before-tab,-indent-with-non-tab,trailing-space
	bare


; ---- dialect_php.ini ----
[PHP]
;;;;;;;;;;;;;;;;;;;;
; Language Options ;
;;;;;;;;;;;;;;;;;;;;

engine = On
short_open_tag = Off
precision = 14
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
disable_functions =
include_path = ".:/usr/share/php"
;extension=curl
extension=mbstring
user_agent="PHP"
date.timezone = "Europe/London" ; set this explicitly
session.save_path = "N;/var/lib/php/sessions"
url_rewriter.tags = "a=href,area=href,frame=src,form="

[CLI Server]
cli_server.color = On


; ---- dialect_python.ini ----
[metadata]
name = example
version = attr: example.__version__
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
install_requires =
    requests>=2.0
    click
python_requires = >=3.9

[options.entry_points]
console_scripts =
    example = example.cli:main

[tox]
requires =
    tox >= 4
envlist = py{310,311,312}

[testenv]
setenv =
    # tools launched here are not clean of this warning
    PYTHONWARNDEFAULTENCODING=
commands =
    {env:COVERAGE_RUN:} pytest {posargs:{env:DEFAULT_ARGS:}}
    coverage: python -c 'import os; print(os.environ.get("CI"))'
basepython = python3.12 # keep in sync with CI

[flake8]
max-line-length: 100
extend-ignore: E203, W503
per-file-ignores =
    __init__.py:F401

[paths]
home = /home/user
data = %(home)s/data
cache = ${paths:home}/.cache


; ---- dialect_systemd.ini ----
#  SPDX-License-Identifier: MIT
[Unit]
Description=Example daemon on %I
Documentation=man:example(8) https://example.com/docs
After=network-online.target
Wants=network-online.target

# comment lines between settings, don't break anything
ConditionPathExists=/dev/tty0

[Service]
Type=notify
ExecStart=-/usr/bin/example --config /etc/example/%i.conf \
          --verbose
ExecReload=/bin/kill -HUP $MAINPID
Environment="LANG=C.UTF-8" "EXTRA=a b"
Restart=on-failure
RestartSec=5s

[Install]
WantedBy=multi-user.target


