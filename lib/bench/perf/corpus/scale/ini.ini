	merge = refs/heads/main
	rebase = true
[branch "release/2026.10"]
	remote = origin
	merge = refs/heads/release/2026.10
[pull]
	ff = only
[push]
	default = simple
	autoSetupRemote = true
	followTags = true
[fetch]
	prune = true
	parallel = 4
