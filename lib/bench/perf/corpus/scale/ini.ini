[PHP]
;;;;;;;;;;;;;;;;;;;;
; Language Options ;
;;;;;;;;;;;;;;;;;;;;

engine = On
short_open_tag = Off
precision = 14
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
disable_functions =
include_path = ".:/usr/share/php"
;extension=curl
