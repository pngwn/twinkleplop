; ---- dialect_python.ini ----
[metadata]
name = example
version = attr: example.__version__
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
install_requires =
    requests>=2.0
    click
python_requires = >=3.9

[options.entry_points]
console_scripts =
    example = example.cli:main

[tox]
requires =
    tox >= 4
envlist = py{310,311,312}

[testenv]
setenv =
    # tools launched here are not clean of this warning
    PYTHONWARNDEFAULTENCODING=
commands =
    {env:COVERAGE_RUN:} pytest {posargs:{env:DEFAULT_ARGS:}}
    coverage: python -c 'import os; print(os.environ.get("CI"))'
basepython = python3.12 # keep in sync with CI

[flake8]
max-line-length: 100
extend-ignore: E203, W503
per-file-ignores =
    __init__.py:F401

[paths]
home = /home/user
data = %(home)s/data
cache = ${paths:home}/.cache


; ---- dialect_systemd.ini ----
#  SPDX-License-Identifier: MIT
[Unit]
Description=Example daemon on %I
Documentation=man:example(8) https://example.com/docs
After=network-online.target
Wants=network-online.target

# comment lines between settings, don't break anything
ConditionPathExists=/dev/tty0

[Service]
Type=notify
ExecStart=-/usr/bin/example --config /etc/example/%i.conf \
          --verbose
ExecReload=/bin/kill -HUP $MAINPID
Environment="LANG=C.UTF-8" "EXTRA=a b"
Restart=on-failure
RestartSec=5s

[Install]
WantedBy=multi-user.target


