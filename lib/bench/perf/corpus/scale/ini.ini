; Acme platform host configuration bundle.
; Concatenated from the files provisioned onto app hosts by the
; acme-infra playbooks, kept together so reviewers can diff one file.

; ---------------------------------------------------------------------
; /etc/php/8.3/fpm/php.ini (excerpt)
; ---------------------------------------------------------------------

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
expose_php = Off
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/acme-fpm.log
variables_order = "GPCS"
request_order = "GP"
post_max_size = 32M
default_charset = "UTF-8"
include_path = ".:/usr/share/php:/srv/acme/lib"
file_uploads = On
upload_tmp_dir = /var/lib/php/uploads
upload_max_filesize = 25M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

[Date]
date.timezone = "Europe/London"

[Session]
session.save_handler = redis
session.save_path = "tcp://cache.internal.acme.dev:6379?database=2&timeout=2.5"
session.use_strict_mode = 1
session.use_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.name = ACMESESSID
session.gc_maxlifetime = 1440   ; 24 minutes
session.sid_length = 48

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0 ; deploys restart fpm, so never stat
opcache.revalidate_freq = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

[mail function]
SMTP = localhost
smtp_port = 25
sendmail_path = "/usr/sbin/sendmail -t -i -f noreply@acme.dev"
mail.add_x_header = Off

