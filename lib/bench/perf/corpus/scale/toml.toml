early_hints = false
adaptive_concurrency = true
experimental = { quic = false, ech = false }

[metadata]
description = """
Edge routing stack.
Multi-line strings keep their newlines, and literal strings like 'C:\\path\\to'
do not process escapes at all.
"""
build_date = 2025-03-14T09:30:00Z
local_date = 1979-05-27
local_time = 07:32:00


# ---- datetime_and_complex.toml ----
# ============================================================
# EDGE CASE FILE 3: Datetimes and Complex Multi-type Document
# Sources: toml-test spec-1.0.0 + manual test cases
# ============================================================

# --- (8) Local date/time/datetime values ---

# Offset datetimes (RFC 3339)
odt1 = 1979-05-27T07:32:00Z
odt2 = 1979-05-27T00:32:00-07:00
odt3 = 1979-05-27T00:32:00.999999-07:00

# From tests/valid/datetime/datetime.toml: space separator, lowercase
space_dt = 1987-07-05 17:45:00Z

# ABNF is case-insensitive, both "Z" and "z" must be supported
lower_dt = 1987-07-05t17:45:00z

# From tests/valid/datetime/milliseconds.toml: millisecond precision
utc1 = 1987-07-05T17:45:56.123Z
utc2 = 1987-07-05T17:45:56.6Z
wita1 = 1987-07-05T17:45:56.123+08:00
wita2 = 1987-07-05T17:45:56.6+08:00

# Local datetime (no timezone)
ldt1 = 1979-05-27T07:32:00
ldt2 = 1979-05-27T00:32:00.999999

# From tests/valid/datetime/local.toml
local = 1987-07-05T17:45:00
milli_ldt = 1977-12-21T10:32:00.555
space_ldt = 1987-07-05 17:45:00

# Local date
ld1 = 1979-05-27

# From tests/valid/datetime/local-date.toml
bestdayever = 1987-07-05

# Local time
lt1 = 07:32:00
lt2 = 00:32:00.999999

# From tests/valid/datetime/local-time.toml
besttimeever = 17:45:00
milliseconds_lt = 10:32:00.555

# From tests/valid/datetime/edge.toml: boundary dates
first_offset = 0001-01-01 00:00:00Z
first_local = 0001-01-01 00:00:00
first_date = 0001-01-01

last_offset = 9999-12-31 23:59:59Z
last_local = 9999-12-31 23:59:59
last_date = 9999-12-31

# From tests/valid/datetime/leap-year.toml: leap year dates
leap_2000_dt = 2000-02-29 15:15:15Z
leap_2000_local = 2000-02-29 15:15:15
leap_2000_date = 2000-02-29

leap_2024_dt = 2024-02-29 15:15:15Z
leap_2024_local = 2024-02-29 15:15:15

# --- Complex multi-type document (real-world config) ---
# Based on toml-test spec-example-1 + array.toml + tricky.toml

# This is a TOML document. Boom.
title = "TOML Example"

[owner]
name = "Lance Uppercut"
dob = 1979-05-27T07:32:00-08:00  # First class dates? Why not?

[database]
server = "192.168.1.1"
ports = [ 8001, 8001, 8002 ]
connection_max = 5000
enabled = true

[servers]

  # You can indent as you please. Tabs or spaces. TOML don't care.
  [servers.alpha]
  ip = "10.0.0.1"
  dc = "eqdc10"

  [servers.beta]
  ip = "10.0.0.2"
  dc = "eqdc10"

[clients]
data = [ ["gamma", "delta"], [1, 2] ]

# Line breaks are OK when inside arrays
hosts = [
  "alpha",
  "omega"
]

# From tests/valid/array/array.toml: mixed-type arrays with datetime values
mixed_dates = [
  1987-07-05T17:45:00Z,
  1979-05-27T07:32:00,
  2006-06-01,
  11:00:00,
]

# From tests/valid/comment/tricky.toml: hash characters in strings and keys
["hash#tag"]
"#!" = "hash bang"
arr3 = [ "#", '#', """###""" ]
tbl1 = { "#" = '}#' }


# ---- strings_and_numerics.toml ----
# ============================================================
# EDGE CASE FILE 1: Strings and Numerics
# Sources: toml-test spec-1.0.0 generated tests + manual tests
# ============================================================

# --- (1) Multi-line basic strings with escape sequences ---

# From spec-1.0.0/string-0: basic string with all escape types
basic_esc = "I'm a string. \"You can quote me\". Name\tJos\u00E9\nLocation\tSF."

# From spec-1.0.0/string-1: simple multiline basic string
str1 = """
Roses are red
Violets are blue"""

# From spec-1.0.0/string-3: line-ending backslash trims whitespace
# These three are byte-for-byte equivalent:
str2 = """
The quick brown \

  fox jumps over \
    the lazy dog."""

str3 = """\
    The quick brown \
  fox jumps over \
    the lazy dog.\
  """

# From tests/valid/string/multiline.toml: whitespace after backslash at EOL
whitespace_after_bs = """\
    The quick brown \
  fox jumps over \
    the lazy dog.\
  """

# From tests/valid/string/multiline.toml: backslash escape edge cases
# a followed by escaped backslash, then newline, then b
escape_bs_1 = """a \\
b"""

# a followed by escaped backslash + line-continuation backslash, then b
escape_bs_2 = """a \\\\
b"""

# a followed by two escaped backslashes, then whitespace+newline, then b
escape_bs_3 = """a \\\\\
  b"""

# From spec-1.0.0/string-4: embedded quotes in multiline basic strings
str4 = """Here are two quotation marks: "". Simple enough."""
str5 = """Here are three quotation marks: """\"."""
str6 = """Here are fifteen quotation marks: ""\"""\"""\"""\"""\"."""

# "This," she said, "is just a pointless statement."
str7 = """"This," she said, "is just a pointless statement." """

# From tests/valid/string/multiline-quotes.toml: quote-edge-case
one = """\"one quote"""
two = """\"\"two quotes"""
one_space = """ "one quote" """
two_space = """ ""two quotes"" """

# Three opening """, then one escaped ", then two "" (allowed), then closing """
escaped = """lol\""" """

mismatch1 = """aaa'''bbb"""

# --- (2) Multi-line literal strings ---

# From spec-1.0.0/string-5: literal strings (no escaping)
winpath = 'C:\Users\nodejs\templates'
winpath2 = '\\ServerX\admin$\system32\'
quoted = 'Tom "Dubs" Preston-Werner'
regex = '<\i\c*\s*>'

# From spec-1.0.0/string-6: multi-line literal strings
regex2 = '''I [dw]on't need \d{2} apples'''
lines  = '''
The first newline is
trimmed in raw strings.
   All other whitespace
   is preserved.
'''

# From spec-1.0.0/string-7: quotes inside multi-line literal strings
quot15 = '''Here are fifteen quotation marks: """""""""""""""'''

# 'That,' she said, 'is still pointless.'
str_lit = ''''That,' she said, 'is still pointless.''''

# From tests/valid/string/multiline-quotes.toml: apostrophe-edge-cases
lit_one = ''''one quote''''
lit_two = '''''two quotes'''''
lit_one_space = ''' 'one quote' '''
lit_two_space = ''' ''two quotes'' '''

mismatch2 = '''aaa"""bbb'''

# --- (7) Various numeric forms ---

# From spec-1.0.0/integer-0: basic integers
int1 = +99
int2 = 42
int3 = 0
int4 = -17

# From spec-1.0.0/integer-1: underscores in integers
int5 = 1_000
int6 = 5_349_221
int7 = 53_49_221  # Indian number system grouping
int8 = 1_2_3_4_5  # VALID but discouraged

# From spec-1.0.0/integer-2: hex, oct, binary
# hexadecimal with prefix 0x
hex1 = 0xDEADBEEF
hex2 = 0xdeadbeef
hex3 = 0xdead_beef

# octal with prefix 0o
oct1 = 0o01234567
oct2 = 0o755  # useful for Unix file permissions

# binary with prefix 0b
bin1 = 0b11010110

# From spec-1.0.0/float-0: fractional, exponent, both
flt1 = +1.0
flt2 = 3.1415
flt3 = -0.01
flt4 = 5e+22
flt5 = 1e06
flt6 = -2E-2
flt7 = 6.626e-34

# From spec-1.0.0/float-1: underscores in float
flt8 = 224_617.445_991_228

# From spec-1.0.0/float-2: infinity and NaN
# infinity
sf1 = inf   # positive infinity
sf2 = +inf  # positive infinity
sf3 = -inf  # negative infinity

# not a number
sf4 = nan   # actual sNaN/qNaN encoding is implementation-specific
sf5 = +nan  # same as nan
sf6 = -nan  # valid, actual encoding is implementation-specific

# From tests/valid/float/float.toml: zero integer part
zero_intpart = 0.123
leading_zero_fractional = 0.0123


# ---- tables_and_keys.toml ----
# ============================================================
# EDGE CASE FILE 2: Tables and Keys
# Sources: toml-test spec-1.0.0 generated tests + manual tests
# ============================================================

# --- (3) Dotted keys ---

# From spec-1.0.0/keys-3: dotted keys creating nested tables
name = "Orange"
physical.color = "orange"
physical.shape = "round"
site."google.com" = true

# From tests/valid/key/dotted.toml: mixed quoting in dotted keys, whitespace around dots
name.first = "Arthur"
"name".'last' = "Dent"

many.dots.here.dot.dot.dot = 42

# Spaces are ignored, and key parts can be quoted
count.a = 1
count . b = 2
"count"."c" = 3
"count" . "d" = 4
'count'.'e' = 5
'count' . 'f' = 6
"count".'g' = 7
"count" . 'h' = 8
count.'i' = 9
count . 'j' = 10
"count".k = 11
"count" . l = 12

# From spec-1.0.0/keys-1: quoted keys (non-ASCII, special chars)
"127.0.0.1" = "value"
"character encoding" = "value"
"ʎǝʞ" = "value"
'key2' = "value"
'quoted "value"' = "value"

# --- (6) Nested tables ---

# From spec-1.0.0/table-2: dotted keys in table headers + nested table values
[dog."tater.man"]
type.name = "pug"

# From spec-1.0.0/table-3: whitespace in table headers
[a.b.c]            # this is best practice
[ d.e.f ]          # same as [d.e.f]
[ g . h . i ]      # same as [g.h.i]
[ j . "ʞ" . 'l' ]  # same as [j."ʞ".'l']

# From spec-1.0.0/table-4: super-tables defined after sub-tables
# [x] you
# [x.y] don't
# [x.y.z] need these
[x.y.z.w]  # for this to work

[x]  # defining a super-table afterward is ok

# From spec-1.0.0/table-8: dotted keys defining tables implicitly
fruit.apple.color = "red"
# Defines a table named fruit
# Defines a table named fruit.apple

fruit.apple.taste.sweet = true
# Defines a table named fruit.apple.taste
# fruit and fruit.apple were already created

# From tests/valid/key/dotted.toml: dotted keys inside a table
[tbl]
a.b.c = 42.666

[a.few.dots]
polka.dot = "again?"
polka.dance-with = "Dot"

# --- (4) Inline tables ---

# From spec-1.0.0/inline-table-0: basic inline tables
name_inline = { first = "Tom", last = "Preston-Werner" }
point = { x = 1, y = 2 }
animal = { type.name = "pug" }  # dotted key inside inline table

# From tests/valid/inline-table/inline-table.toml: more inline table variants
simple = { a = 1 }
str-key = { "a" = 1 }
table-array = [{ "a" = 1 }, { "b" = 2 }]  # array of inline tables

# From spec-1.0.0/array-0: inline table inside an array
contributors = [
  "Foo Bar ",
  { name = "Baz Qux", email = "bazqux@example.com", url = "https://example.com/bazqux" }
]

# --- (5) Array-of-tables [[...]] ---

# From tests/valid/array/array-subtables.toml: array-of-tables with subtables
[[arr]]
[arr.subtab]
val = 1

[[arr]]
[arr.subtab]
val = 2

# From tests/valid/key/dotted.toml: dotted keys inside array-of-tables
[[arr2]]
a.b.c = 1
a.b.d = 2

[[arr2]]
a.b.c = 3
a.b.d = 4

# TOML spec example: nested array-of-tables
[[fruits]]
name = "apple"

[fruits.physical]
color = "red"
shape = "round"

[[fruits.varieties]]
name = "red delicious"

[[fruits.varieties]]
name = "granny smith"

[[fruits]]
name = "banana"

[[fruits.varieties]]
name = "plantain"


# Cargo workspace manifest for the edge stack.

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/router",
    "crates/store",
    "crates/telemetry",
    "xtask",
]
exclude = ["fuzz", "examples/legacy"]
default-members = ["crates/router"]

[workspace.package]
version = "0.14.3"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/acme/edge-stack"
homepage = "https://edge.acme.dev"
authors = ["Platform Team <platform@acme.dev>"]
keywords = ["proxy", "http", "edge", "routing"]
categories = ["network-programming", "web-programming::http-server"]

[workspace.dependencies]
anyhow = "1.0.86"
async-trait = "0.1.81"
bytes = { version = "1.7", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hyper = { version = "1.4", features = ["http1", "http2", "server", "client"] }
serde = { version = "1.0.209", features = ["derive", "rc"] }
serde_json = { version = "1.0.127", features = ["preserve_order", "raw_value"] }
thiserror = "1.0.63"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = { version = "0.1.40", default-features = false, features = ["std", "attributes"] }

core = { path = "crates/core", version = "0.14.3" }
store = { path = "crates/store", version = "0.14.3" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
opt-level = 0
debug = 2
split-debuginfo = "unpacked"

[profile.dev.package.backtrace]
opt-level = 3

